<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foyerr Import Helper store screenshots</title>
    <!--
      Chrome Web Store screenshots, 1280×800. Open with ?shot=pick, letterboxd-progress,
      letterboxd-done or kinopoisk-ready and screenshot the page at that size.
    -->
    <style>
      @font-face {
        font-family: Rubik;
        src: url('../../node_modules/@fontsource-variable/rubik/files/rubik-latin-wght-normal.woff2');
        font-weight: 300 900;
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: Rubik;
        src: url('../../node_modules/@fontsource-variable/rubik/files/rubik-cyrillic-wght-normal.woff2');
        font-weight: 300 900;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family:
          Rubik,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        font-weight: 375;
        color: #171717;
      }
      button {
        font: inherit;
      }

      .shot {
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background: #ebe8e1;
      }
      .browser {
        width: 100%;
        height: 100%;
        background: white;
      }

      .content {
        height: 100%;
        display: flex;
      }
      .site {
        flex: 1;
        min-width: 0;
        position: relative;
        overflow: hidden;
      }

      /* Letterboxd page */
      .site.letterboxd {
        background: #14181c;
        color: #9ab;
      }
      .lb-header {
        height: 70px;
        padding: 0 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #14181c;
        border-bottom: 1px solid #2c3440;
      }
      .lb-brand {
        color: #fff;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.3px;
      }
      .lb-nav {
        display: flex;
        gap: 24px;
        color: #9ab;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .lb-page {
        padding: 34px 54px;
      }
      .lb-page h2 {
        margin: 0 0 6px;
        color: #fff;
        font-size: 26px;
        font-weight: 500;
      }
      .lb-tabs {
        display: flex;
        gap: 20px;
        margin: 14px 0 18px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .lb-tabs .active {
        color: #fff;
      }
      .diary-row {
        display: grid;
        grid-template-columns: 56px 42px 1fr 80px 110px;
        align-items: center;
        gap: 14px;
        padding: 10px 4px;
        border-top: 1px solid #2c3440;
        font-size: 14px;
      }
      .diary-day {
        color: #fff;
        font-size: 22px;
        text-align: center;
      }
      .diary-row .poster {
        width: 38px;
        height: 56px;
        border-radius: 3px;
      }
      .diary-row b {
        color: #fff;
        font-weight: 500;
      }
      .stars {
        color: #00c030;
        letter-spacing: 1px;
      }

      /* Kinopoisk page */
      .site.kinopoisk {
        background: #f7f6f3;
      }
      .kp-header {
        height: 70px;
        padding: 0 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #111;
        color: white;
      }
      .kp-brand {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.3px;
      }
      .kp-nav {
        display: flex;
        gap: 24px;
        color: #b8b8b8;
        font-size: 13px;
      }
      .library {
        padding: 34px 54px;
        max-width: 870px;
      }
      .eyebrow {
        color: #777;
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 1.5px;
        font-weight: 600;
      }
      .library h2 {
        margin: 7px 0 6px;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: -0.8px;
      }
      .library-lead {
        margin: 0 0 25px;
        color: #737373;
        font-size: 14px;
      }
      .filter-row {
        display: flex;
        gap: 8px;
        margin-bottom: 18px;
      }
      .chip {
        padding: 7px 12px;
        border-radius: 18px;
        font-size: 12px;
        background: #e9e6df;
        color: #5d5d5d;
      }
      .chip.active {
        color: white;
        background: #202020;
      }
      .movie {
        display: grid;
        grid-template-columns: 42px 1fr auto;
        align-items: center;
        gap: 14px;
        padding: 12px 4px;
        border-top: 1px solid #ddd9d1;
      }
      .movie .poster {
        width: 38px;
        height: 50px;
        border-radius: 4px;
      }
      .movie b {
        display: block;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 4px;
      }
      .movie small {
        color: #838383;
        font-size: 12px;
      }
      .kp-rating {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #3bb33b;
        color: white;
        font-weight: 600;
        font-size: 13px;
      }

      /* Side panel, drawn after entrypoints/sidepanel/App.tsx */
      .side-panel {
        width: 386px;
        flex: none;
        background: #fff;
        border-left: 1px solid #d7d7d7;
        box-shadow: -12px 0 35px rgba(0, 0, 0, 0.09);
      }
      .panel {
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        font-size: 14px;
        line-height: 1.43;
      }
      .panel header {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .panel h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.55;
        font-weight: 450;
      }
      .back {
        margin-left: -6px;
        padding: 4px;
        color: #737373;
        display: grid;
      }
      .muted {
        color: #737373;
      }
      .lead {
        margin: 0;
      }
      .icon {
        width: 18px;
        height: 18px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .green {
        color: #16a34a;
      }
      .blue {
        color: #2563eb;
      }
      .red {
        color: #b91c1c;
      }
      .spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .sites {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .site-button {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        font-weight: 425;
      }
      .site-button span {
        flex: 1;
      }
      .account {
        display: flex;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #f5f5f5;
      }
      .account .icon {
        margin-top: 1px;
      }
      .rows {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 0;
        border-top: 1px solid #e5e5e5;
      }
      .row.pending {
        color: #737373;
      }
      .count {
        margin-left: auto;
        color: #737373;
        font-variant-numeric: tabular-nums;
      }
      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        color: #737373;
        font-size: 12px;
      }
      .stat {
        border-radius: 8px;
        background: #f5f5f5;
        padding: 8px 10px;
      }
      .stat b {
        display: block;
        color: #171717;
        font-size: 20px;
        font-weight: 450;
        line-height: 1.4;
      }
      .footer {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .button {
        width: 100%;
        border-radius: 8px;
        padding: 8px 12px;
        border: 1px solid #e5e5e5;
        background: white;
        color: #171717;
      }
      .button.primary {
        background: #171717;
        border-color: #171717;
        color: white;
      }

      /* The caption on the page */
      .story-label {
        position: absolute;
        z-index: 2;
        left: 54px;
        bottom: 34px;
        max-width: 480px;
        padding: 16px 19px;
        border-radius: 13px;
        color: #f4f0f1;
        background: rgba(118, 71, 111, 0.97);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
      }
      .story-label b {
        display: block;
        margin-bottom: 3px;
        font-size: 18px;
        font-weight: 500;
      }
      .story-label span {
        color: #e2dcde;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="shot">
      <div class="browser">
        <div class="content">
          <section class="site" id="site"></section>
          <aside class="side-panel">
            <main class="panel" id="panel"></main>
          </aside>
        </div>
      </div>
    </div>

    <template id="letterboxd-page">
      <div class="lb-header">
        <div class="lb-brand">Letterboxd</div>
        <div class="lb-nav"><span>Films</span><span>Lists</span><span>Members</span></div>
      </div>
      <div class="lb-page">
        <h2>Diary</h2>
        <div class="lb-tabs">
          <span>Profile</span><span>Films</span><span class="active">Diary</span
          ><span>Watchlist</span>
        </div>
        <div class="diary-row">
          <div class="diary-day">24</div>
          <div class="poster" style="background: linear-gradient(145deg, #3c2a1a, #d8a25a)"></div>
          <div><b>Dune: Part Two</b></div>
          <div>2024</div>
          <div class="stars">★★★★½</div>
        </div>
        <div class="diary-row">
          <div class="diary-day">21</div>
          <div class="poster" style="background: linear-gradient(145deg, #1f3a4a, #9cc3d0)"></div>
          <div><b>Past Lives</b></div>
          <div>2023</div>
          <div class="stars">★★★★★</div>
        </div>
        <div class="diary-row">
          <div class="diary-day">14</div>
          <div class="poster" style="background: linear-gradient(145deg, #2a1c18, #c4683c)"></div>
          <div><b>Oppenheimer</b></div>
          <div>2023</div>
          <div class="stars">★★★★</div>
        </div>
        <div class="diary-row">
          <div class="diary-day">09</div>
          <div class="poster" style="background: linear-gradient(145deg, #17323c, #6fb0b8)"></div>
          <div><b>Aftersun</b></div>
          <div>2022</div>
          <div class="stars">★★★★½</div>
        </div>
        <div class="diary-row">
          <div class="diary-day">02</div>
          <div class="poster" style="background: linear-gradient(145deg, #23301f, #9fb57a)"></div>
          <div><b>Perfect Days</b></div>
          <div>2023</div>
          <div class="stars">★★★★</div>
        </div>
      </div>
      <div class="story-label" id="story"></div>
    </template>

    <template id="kinopoisk-page">
      <div class="kp-header">
        <div class="kp-brand">Кинопоиск</div>
        <div class="kp-nav"><span>Фильмы</span><span>Сериалы</span><span>Моё кино</span></div>
      </div>
      <div class="library">
        <div class="eyebrow">Личная коллекция</div>
        <h2>Мои фильмы</h2>
        <p class="library-lead">Оценки, просмотры и сохранённые фильмы.</p>
        <div class="filter-row">
          <span class="chip active">Оценки</span><span class="chip">Просмотры</span
          ><span class="chip">Буду смотреть</span><span class="chip">Любимые фильмы</span>
        </div>
        <div class="movie">
          <div class="poster" style="background: linear-gradient(145deg, #303030, #ff6b00)"></div>
          <div><b>Интерстеллар</b><small>Interstellar · 2014</small></div>
          <div class="kp-rating">9</div>
        </div>
        <div class="movie">
          <div class="poster" style="background: linear-gradient(145deg, #b68f63, #202020)"></div>
          <div><b>Дюна: Часть вторая</b><small>Dune: Part Two · 2024</small></div>
          <div class="kp-rating">8</div>
        </div>
        <div class="movie">
          <div class="poster" style="background: linear-gradient(145deg, #25394a, #7899a8)"></div>
          <div><b>Извне</b><small>From · 2022</small></div>
          <div class="kp-rating">8</div>
        </div>
        <div class="movie">
          <div class="poster" style="background: linear-gradient(145deg, #531a16, #e6a447)"></div>
          <div><b>Орудия</b><small>Weapons · 2025</small></div>
          <div class="kp-rating">7</div>
        </div>
        <div class="movie">
          <div class="poster" style="background: linear-gradient(145deg, #1f211f, #78836c)"></div>
          <div><b>Разделение</b><small>Severance · 2022</small></div>
          <div class="kp-rating">9</div>
        </div>
      </div>
      <div class="story-label" id="story"></div>
    </template>

    <script>
      // Lucide icons, as the side panel draws them.
      const ICONS = {
        arrowLeft: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
        chevronRight: '<path d="m9 18 6-6-6-6"/>',
        check: '<path d="M20 6 9 17l-5-5"/>',
        circle: '<circle cx="12" cy="12" r="10"/>',
        loader: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
        x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
        alert:
          '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
        calendarCheck:
          '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/>',
        eye: '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
        clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
        star: '<path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/>',
        heart:
          '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
      }
      const icon = (name, className = '') =>
        `<svg class="icon ${className}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`

      const header = (title, back = true) =>
        `<header>${back ? `<span class="back">${icon('arrowLeft')}</span>` : ''}<h1>${title}</h1></header>`
      const row = (iconHtml, label, count = '', pending = false) =>
        `<li class="row${pending ? ' pending' : ''}">${iconHtml}${label}<span class="count">${count}</span></li>`
      const done = (label, count) => row(icon('check', 'green'), label, count)
      const pending = (label) => row(icon('circle'), label, '', true)

      const SITES = {
        letterboxd: {
          page: 'letterboxd-page',
        },
        kinopoisk: {
          page: 'kinopoisk-page',
        },
      }

      const SHOTS = {
        pick: {
          site: 'letterboxd',
          story:
            '<b>Letterboxd or Kinopoisk</b><span>Pick the site your library is on. You get one file to import into Foyerr.</span>',
          panel: `${header('Foyerr Import Helper', false)}
            <p class="lead muted">Pick the site your library is on. You'll get a file to import into Foyerr.</p>
            <div class="sites">
              <div class="site-button"><span>Letterboxd</span>${icon('chevronRight', 'muted')}</div>
              <div class="site-button"><span>Kinopoisk</span>${icon('chevronRight', 'muted')}</div>
            </div>`,
        },
        'letterboxd-progress': {
          site: 'letterboxd',
          story:
            '<b>Every diary entry, with its date</b><span>The panel reads your diary, films and watchlist one page at a time and shows where it is.</span>',
          panel: `${header('Exporting…', false)}
            <p class="lead muted">Keep this panel open.</p>
            <ul class="rows">
              ${done('Diary', '412')}
              ${row(icon('loader', 'blue spin'), 'Films', 'page 14 of 23')}
              ${pending('Watchlist')}
              ${pending('TMDB IDs')}
            </ul>
            <div class="footer"><button class="button">Cancel</button></div>`,
        },
        'letterboxd-done': {
          site: 'letterboxd',
          story:
            '<b>One file for Foyerr</b><span>Ratings, watches and your watchlist with TMDB IDs, saved to your downloads.</span>',
          panel: `${header('Export saved')}
            <p class="lead muted">letterboxd-library.json is in your downloads.</p>
            <div class="stats">
              <div class="stat"><b>401</b>Ratings</div>
              <div class="stat"><b>11</b>Watches</div>
              <div class="stat"><b>6</b>Seen</div>
              <div class="stat"><b>127</b>Watchlist</div>
            </div>
            <div class="footer">
              <button class="button primary">Download again</button>
              <button class="button">Start over</button>
            </div>`,
        },
        'kinopoisk-ready': {
          site: 'kinopoisk',
          story:
            '<b>Kinopoisk too</b><span>Ratings, watches, watchlist and favorites, with the dates from your pages.</span>',
          panel: `${header('Kinopoisk Export')}
            <div class="account">${icon('check', 'green')}<span>Signed in on kinopoisk.ru</span></div>
            <ul class="rows">
              ${row(icon('eye'), 'Watches')}
              ${row(icon('star'), 'Ratings')}
              ${row(icon('clock'), 'Watchlist')}
              ${row(icon('heart'), 'Favorites')}
            </ul>
            <div class="footer"><button class="button primary">Export library</button></div>`,
        },
      }

      const shot = SHOTS[new URLSearchParams(location.search).get('shot')] ?? SHOTS.pick
      const site = SITES[shot.site]
      const siteElement = document.querySelector('#site')
      siteElement.className = `site ${shot.site}`
      siteElement.append(document.querySelector(`#${site.page}`).content.cloneNode(true))
      document.querySelector('#story').innerHTML = shot.story
      document.querySelector('#panel').innerHTML = shot.panel
    </script>
  </body>
</html>
