<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foyerr Import Helper store screenshots</title>
    <!--
      Chrome Web Store screenshots, 1280×800. Open with ?shot=pick, imdb-ready,
      letterboxd-progress or letterboxd-done and screenshot the page at that size.
    -->
    <style>
      @font-face {
        font-family: Rubik;
        src: url('../../node_modules/@fontsource-variable/rubik/files/rubik-latin-wght-normal.woff2');
        font-weight: 300 900;
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: Rubik;
        src: url('../../node_modules/@fontsource-variable/rubik/files/rubik-cyrillic-wght-normal.woff2');
        font-weight: 300 900;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family:
          Rubik,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        font-weight: 375;
        color: #171717;
      }
      button {
        font: inherit;
      }

      .shot {
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background: #ebe8e1;
      }
      .browser {
        width: 100%;
        height: 100%;
        background: white;
      }

      .content {
        height: 100%;
        display: flex;
      }
      .site {
        flex: 1;
        min-width: 0;
        position: relative;
        overflow: hidden;
      }

      /* The library list on the left. Each row keeps the rating style of its site. */
      .library {
        background: #f7f6f3;
        padding: 46px 54px;
      }
      .eyebrow {
        color: #777;
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 1.5px;
        font-weight: 600;
      }
      .library h2 {
        margin: 7px 0 24px;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: -0.8px;
      }
      .movie {
        display: grid;
        grid-template-columns: 42px 1fr auto auto;
        align-items: center;
        gap: 16px;
        padding: 11px 4px;
        border-top: 1px solid #ddd9d1;
      }
      .movie .poster {
        width: 38px;
        height: 54px;
        border-radius: 4px;
      }
      .movie b {
        display: block;
        font-size: 15px;
        font-weight: 500;
        margin-bottom: 4px;
      }
      .movie small {
        color: #838383;
        font-size: 12px;
      }
      .movie .state {
        color: #737373;
        font-size: 13px;
      }
      .placeholder {
        height: 10px;
        border-radius: 5px;
        background: #e6e2da;
      }
      .placeholder.poster {
        height: 54px;
        border-radius: 4px;
      }
      .imdb-rating {
        color: #5799ef;
        font-size: 15px;
        font-weight: 500;
      }
      .lb-rating {
        color: #00c030;
        font-size: 15px;
        letter-spacing: 1px;
      }
      .kp-rating {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #3bb33b;
        color: white;
        font-weight: 600;
        font-size: 13px;
      }
      .tag {
        min-width: 104px;
        padding: 4px 8px;
        border-radius: 5px;
        font-size: 12px;
        text-align: center;
        white-space: nowrap;
      }
      .tag.imdb {
        background: #121212;
        color: #f5c518;
      }
      .tag.letterboxd {
        background: #14181c;
        color: #fff;
      }
      .tag.kinopoisk {
        background: #2b2b2b;
        color: #fff;
      }
      .tag.tmdb {
        background: #e3eedb;
        color: #27500a;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11.5px;
      }

      /* Side panel, drawn after entrypoints/sidepanel/App.tsx */
      .side-panel {
        width: 386px;
        flex: none;
        background: #fff;
        border-left: 1px solid #d7d7d7;
        box-shadow: -12px 0 35px rgba(0, 0, 0, 0.09);
      }
      .panel {
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        font-size: 14px;
        line-height: 1.43;
      }
      .panel header {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .panel h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.55;
        font-weight: 450;
      }
      .back {
        margin-left: -6px;
        padding: 4px;
        color: #737373;
        display: grid;
      }
      .muted {
        color: #737373;
      }
      .lead {
        margin: 0;
      }
      .icon {
        width: 18px;
        height: 18px;
        flex: none;
      }
      .green {
        color: #16a34a;
      }
      .blue {
        color: #2563eb;
      }
      .red {
        color: #b91c1c;
      }
      .spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .sites {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .site-button {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        font-weight: 425;
      }
      .site-button span {
        flex: 1;
      }
      .account {
        display: flex;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #f5f5f5;
      }
      .account .icon {
        margin-top: 1px;
      }
      .rows {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 0;
        border-top: 1px solid #e5e5e5;
      }
      .row.pending {
        color: #737373;
      }
      .count {
        margin-left: auto;
        color: #737373;
        font-variant-numeric: tabular-nums;
      }
      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        color: #737373;
        font-size: 12px;
      }
      .stat {
        border-radius: 8px;
        background: #f5f5f5;
        padding: 8px 10px;
      }
      .stat b {
        display: block;
        color: #171717;
        font-size: 20px;
        font-weight: 450;
        line-height: 1.4;
      }
      .footer {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .button {
        width: 100%;
        border-radius: 8px;
        padding: 8px 12px;
        border: 1px solid #e5e5e5;
        background: white;
        color: #171717;
      }
      .button.primary {
        background: #171717;
        border-color: #171717;
        color: white;
      }

      /* The caption on the page */
      .story-label {
        position: absolute;
        z-index: 2;
        left: 54px;
        bottom: 34px;
        max-width: 480px;
        padding: 16px 19px;
        border-radius: 13px;
        color: #f4f0f1;
        background: rgba(118, 71, 111, 0.97);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
      }
      .story-label b {
        display: block;
        margin-bottom: 3px;
        font-size: 18px;
        font-weight: 500;
      }
      .story-label span {
        color: #e2dcde;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="shot">
      <div class="browser">
        <div class="content">
          <section class="site library" id="site"></section>
          <aside class="side-panel">
            <main class="panel" id="panel"></main>
          </aside>
        </div>
      </div>
    </div>

    <script>
      // Hugeicons, as the side panel draws them.
      const ICONS = {
        arrowLeft:
          '<path d="M5.5 12.002H19" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><path d="M10.9999 18.002C10.9999 18.002 4.99998 13.583 4.99997 12.0019C4.99996 10.4208 11 6.00195 11 6.00195" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>',
        chevronRight:
          '<path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>',
        check:
          '<path d="M5 14L8.5 17.5L19 6.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>',
        circle:
          '<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5"/>',
        loader:
          '<path d="M21.9961 12C21.9961 17.5228 17.5189 22 11.9961 22C6.47325 22 1.99609 17.5228 1.99609 12C1.99609 6.47715 6.47325 2 11.9961 2" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"/>',
        eye: '<path d="M21.544 11.045C21.848 11.4713 22 11.6845 22 12C22 12.3155 21.848 12.5287 21.544 12.955C20.1779 14.8706 16.6892 19 12 19C7.31078 19 3.8221 14.8706 2.45604 12.955C2.15201 12.5287 2 12.3155 2 12C2 11.6845 2.15201 11.4713 2.45604 11.045C3.8221 9.12944 7.31078 5 12 5C16.6892 5 20.1779 9.12944 21.544 11.045Z" stroke="currentColor" stroke-width="1.5"/><path d="M15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15C13.6569 15 15 13.6569 15 12Z" stroke="currentColor" stroke-width="1.5"/>',
        clock:
          '<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/><path d="M12 8V12L14 14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>',
        star: '<path d="M13.7276 3.44418L15.4874 6.99288C15.7274 7.48687 16.3673 7.9607 16.9073 8.05143L20.0969 8.58575C22.1367 8.92853 22.6167 10.4206 21.1468 11.8925L18.6671 14.3927C18.2471 14.8161 18.0172 15.6327 18.1471 16.2175L18.8571 19.3125C19.417 21.7623 18.1271 22.71 15.9774 21.4296L12.9877 19.6452C12.4478 19.3226 11.5579 19.3226 11.0079 19.6452L8.01827 21.4296C5.8785 22.71 4.57865 21.7522 5.13859 19.3125L5.84851 16.2175C5.97849 15.6327 5.74852 14.8161 5.32856 14.3927L2.84884 11.8925C1.389 10.4206 1.85895 8.92853 3.89872 8.58575L7.08837 8.05143C7.61831 7.9607 8.25824 7.48687 8.49821 6.99288L10.258 3.44418C11.2179 1.51861 12.7777 1.51861 13.7276 3.44418Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>',
      }
      const icon = (name, className = '') =>
        `<svg class="icon ${className}" viewBox="0 0 24 24" fill="none" aria-hidden="true">${ICONS[name]}</svg>`

      const header = (title, back = true) =>
        `<header>${back ? `<span class="back">${icon('arrowLeft')}</span>` : ''}<h1>${title}</h1></header>`
      const row = (iconHtml, label, count = '', pending = false) =>
        `<li class="row${pending ? ' pending' : ''}">${iconHtml}${label}<span class="count">${count}</span></li>`
      const done = (label, count) => row(icon('check', 'green'), label, count)
      const pending = (label) => row(icon('circle'), label, '', true)

      const poster = (colors) =>
        `<div class="poster" style="background: linear-gradient(145deg, ${colors})"></div>`
      const movie = (colors, title, details, mark, tag) =>
        `<div class="movie">${poster(colors)}<div><b>${title}</b><small>${details}</small></div>${mark}${tag}</div>`
      const placeholder = (width) =>
        `<div class="movie"><div class="placeholder poster"></div><div class="placeholder" style="width: ${width}px"></div><div class="placeholder" style="width: 76px"></div><div class="placeholder" style="width: 104px"></div></div>`
      const imdb = (value) => `<span class="imdb-rating">★ ${value}</span>`
      const stars = (text) => `<span class="lb-rating">${text}</span>`
      const kp = (value) => `<span class="kp-rating">${value}</span>`
      const state = (text) => `<span class="state">${text}</span>`
      const tag = (site, text) => `<span class="tag ${site}">${text}</span>`
      const library = (eyebrow, title, rows) =>
        `<div class="eyebrow">${eyebrow}</div><h2>${title}</h2>${rows.join('')}`

      const POSTERS = {
        severance: '#1f211f, #78836c',
        breakingBad: '#2c3b1d, #c9b04a',
        oppenheimer: '#2a1c18, #c4683c',
        normalPeople: '#25394a, #7899a8',
        dune: '#3c2a1a, #d8a25a',
        pastLives: '#1f3a4a, #9cc3d0',
        aftersun: '#17323c, #6fb0b8',
        perfectDays: '#23301f, #9fb57a',
        interstellar: '#303030, #ff6b00',
        from: '#531a16, #e6a447',
      }

      const SHOTS = {
        pick: {
          story:
            '<b>IMDb, Letterboxd or Kinopoisk</b><span>Pick the site your library is on. You get one file to import into Foyerr.</span>',
          site: library('From three sites', 'Your library', [
            movie(POSTERS.severance, 'Severance', 'TV series · 2022', imdb(9), tag('imdb', 'IMDb')),
            movie(
              POSTERS.dune,
              'Dune: Part Two',
              'Film · 2024',
              stars('★★★★½'),
              tag('letterboxd', 'Letterboxd')
            ),
            movie(
              POSTERS.interstellar,
              'Интерстеллар',
              'Interstellar · 2014',
              kp(9),
              tag('kinopoisk', 'Кинопоиск')
            ),
            movie(
              POSTERS.breakingBad,
              'Pilot',
              'Breaking Bad · S1.E1 · 2008',
              imdb(10),
              tag('imdb', 'IMDb')
            ),
            movie(
              POSTERS.pastLives,
              'Past Lives',
              'Film · 2023',
              stars('★★★★★'),
              tag('letterboxd', 'Letterboxd')
            ),
            movie(POSTERS.from, 'Извне', 'From · 2022', kp(8), tag('kinopoisk', 'Кинопоиск')),
          ]),
          panel: `${header('Foyerr Import Helper', false)}
            <p class="lead muted">Pick the site your library is on. You'll get a file to import into Foyerr.</p>
            <div class="sites">
              <div class="site-button"><span>IMDb</span>${icon('chevronRight', 'muted')}</div>
              <div class="site-button"><span>Letterboxd</span>${icon('chevronRight', 'muted')}</div>
              <div class="site-button"><span>Kinopoisk</span>${icon('chevronRight', 'muted')}</div>
            </div>`,
        },
        'imdb-ready': {
          story:
            '<b>Now with IMDb</b><span>Ratings, watch history and watchlist, episodes included.</span>',
          site: library('IMDb', 'Your IMDb library', [
            movie(
              POSTERS.severance,
              'Severance',
              'TV series · 2022',
              imdb(9),
              tag('imdb', 'Rated')
            ),
            movie(
              POSTERS.breakingBad,
              'Pilot',
              'Breaking Bad · S1.E1 · 2008',
              imdb(10),
              tag('imdb', 'Rated')
            ),
            movie(
              POSTERS.oppenheimer,
              'Oppenheimer',
              'Film · 2023',
              state('Watched'),
              tag('imdb', 'Watch history')
            ),
            movie(
              POSTERS.normalPeople,
              'Normal People',
              'TV mini series · 2020',
              state('Mar 18, 2023'),
              tag('imdb', 'Watchlist')
            ),
            movie(
              POSTERS.perfectDays,
              'Perfect Days',
              'Film · 2023',
              imdb(8),
              tag('imdb', 'Rated')
            ),
          ]),
          panel: `${header('IMDb Export')}
            <div class="account">${icon('check', 'green')}<span>Signed in on imdb.com as moviegoer</span></div>
            <ul class="rows">
              ${row(icon('star'), 'Ratings')}
              ${row(icon('eye'), 'Watch history')}
              ${row(icon('clock'), 'Watchlist')}
            </ul>
            <div class="footer"><button class="button primary">Export library</button></div>`,
        },
        'letterboxd-progress': {
          story:
            '<b>Every diary entry, with its date</b><span>The panel reads your diary, films and watchlist one page at a time and shows where it is.</span>',
          site: library('Letterboxd', 'Your Letterboxd library', [
            movie(
              POSTERS.dune,
              'Dune: Part Two',
              'Film · 2024',
              stars('★★★★½'),
              tag('letterboxd', 'Diary · Sep 24')
            ),
            movie(
              POSTERS.pastLives,
              'Past Lives',
              'Film · 2023',
              stars('★★★★★'),
              tag('letterboxd', 'Diary · Sep 21')
            ),
            movie(
              POSTERS.aftersun,
              'Aftersun',
              'Film · 2022',
              stars('★★★★½'),
              tag('letterboxd', 'Films')
            ),
            placeholder(180),
            placeholder(130),
          ]),
          panel: `${header('Exporting…', false)}
            <p class="lead muted">Keep this panel open.</p>
            <ul class="rows">
              ${done('Diary', '412')}
              ${row(icon('loader', 'blue spin'), 'Films', 'page 14 of 23')}
              ${pending('Watchlist')}
              ${pending('TMDB IDs')}
            </ul>
            <div class="footer"><button class="button">Cancel</button></div>`,
        },
        'letterboxd-done': {
          story:
            '<b>One file for Foyerr</b><span>Ratings, watches and your watchlist with TMDB IDs, saved to your downloads.</span>',
          site: library('Letterboxd', 'Your Letterboxd library', [
            movie(
              POSTERS.dune,
              'Dune: Part Two',
              'Film · 2024',
              stars('★★★★½'),
              tag('tmdb', 'tmdb 693134')
            ),
            movie(
              POSTERS.pastLives,
              'Past Lives',
              'Film · 2023',
              stars('★★★★★'),
              tag('tmdb', 'tmdb 666277')
            ),
            movie(
              POSTERS.oppenheimer,
              'Oppenheimer',
              'Film · 2023',
              stars('★★★★'),
              tag('tmdb', 'tmdb 872585')
            ),
            movie(
              POSTERS.aftersun,
              'Aftersun',
              'Film · 2022',
              stars('★★★★½'),
              tag('tmdb', 'tmdb 965150')
            ),
            movie(
              POSTERS.perfectDays,
              'Perfect Days',
              'Film · 2023',
              state('Watchlist'),
              tag('tmdb', 'tmdb 976893')
            ),
          ]),
          panel: `${header('Export saved')}
            <p class="lead muted">letterboxd-library.json is in your downloads.</p>
            <div class="stats">
              <div class="stat"><b>401</b>Ratings</div>
              <div class="stat"><b>11</b>Watches</div>
              <div class="stat"><b>6</b>Seen</div>
              <div class="stat"><b>127</b>Watchlist</div>
            </div>
            <div class="footer">
              <button class="button primary">Download again</button>
              <button class="button">Start over</button>
            </div>`,
        },
      }

      const shot = SHOTS[new URLSearchParams(location.search).get('shot')] ?? SHOTS.pick
      document.querySelector('#site').innerHTML =
        `${shot.site}<div class="story-label" id="story"></div>`
      document.querySelector('#story').innerHTML = shot.story
      document.querySelector('#panel').innerHTML = shot.panel
    </script>
  </body>
</html>
