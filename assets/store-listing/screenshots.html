<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foyerr Import Helper store screenshots</title>
    <!--
      Chrome Web Store screenshots, 1280×800. Open with ?shot=pick, letterboxd-progress,
      letterboxd-done or kinopoisk-ready and screenshot the page at that size.
    -->
    <style>
      @font-face {
        font-family: Rubik;
        src: url('../../node_modules/@fontsource-variable/rubik/files/rubik-latin-wght-normal.woff2');
        font-weight: 300 900;
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: Rubik;
        src: url('../../node_modules/@fontsource-variable/rubik/files/rubik-cyrillic-wght-normal.woff2');
        font-weight: 300 900;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family:
          Rubik,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        font-weight: 375;
        color: #171717;
      }
      button {
        font: inherit;
      }

      .shot {
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background: #ebe8e1;
      }
      .browser {
        width: 100%;
        height: 100%;
        background: white;
      }

      .content {
        height: 100%;
        display: flex;
      }
      .site {
        flex: 1;
        min-width: 0;
        position: relative;
        overflow: hidden;
      }

      /* Letterboxd page */
      .site.letterboxd {
        background: #14181c;
        color: #9ab;
      }
      .lb-header {
        height: 70px;
        padding: 0 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #14181c;
        border-bottom: 1px solid #2c3440;
      }
      .lb-brand {
        color: #fff;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.3px;
      }
      .lb-nav {
        display: flex;
        gap: 24px;
        color: #9ab;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .lb-page {
        padding: 34px 54px;
      }
      .lb-page h2 {
        margin: 0 0 6px;
        color: #fff;
        font-size: 26px;
        font-weight: 500;
      }
      .lb-tabs {
        display: flex;
        gap: 20px;
        margin: 14px 0 18px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .lb-tabs .active {
        color: #fff;
      }
      .diary-row {
        display: grid;
        grid-template-columns: 56px 42px 1fr 80px 110px;
        align-items: center;
        gap: 14px;
        padding: 10px 4px;
        border-top: 1px solid #2c3440;
        font-size: 14px;
      }
      .diary-day {
        color: #fff;
        font-size: 22px;
        text-align: center;
      }
      .diary-row .poster {
        width: 38px;
        height: 56px;
        border-radius: 3px;
      }
      .diary-row b {
        color: #fff;
        font-weight: 500;
      }
      .stars {
        color: #00c030;
        letter-spacing: 1px;
      }

      /* Kinopoisk page */
      .site.kinopoisk {
        background: #f7f6f3;
      }
      .kp-header {
        height: 70px;
        padding: 0 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #111;
        color: white;
      }
      .kp-brand {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.3px;
      }
      .kp-nav {
        display: flex;
        gap: 24px;
        color: #b8b8b8;
        font-size: 13px;
      }
      .library {
        padding: 34px 54px;
        max-width: 870px;
      }
      .eyebrow {
        color: #777;
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 1.5px;
        font-weight: 600;
      }
      .library h2 {
        margin: 7px 0 6px;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: -0.8px;
      }
      .library-lead {
        margin: 0 0 25px;
        color: #737373;
        font-size: 14px;
      }
      .filter-row {
        display: flex;
        gap: 8px;
        margin-bottom: 18px;
      }
      .chip {
        padding: 7px 12px;
        border-radius: 18px;
        font-size: 12px;
        background: #e9e6df;
        color: #5d5d5d;
      }
      .chip.active {
        color: white;
        background: #202020;
      }
      .movie {
        display: grid;
        grid-template-columns: 42px 1fr auto;
        align-items: center;
        gap: 14px;
        padding: 12px 4px;
        border-top: 1px solid #ddd9d1;
      }
      .movie .poster {
        width: 38px;
        height: 50px;
        border-radius: 4px;
      }
      .movie b {
        display: block;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 4px;
      }
      .movie small {
        color: #838383;
        font-size: 12px;
      }
      .kp-rating {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #3bb33b;
        color: white;
        font-weight: 600;
        font-size: 13px;
      }

      /* Side panel, drawn after entrypoints/sidepanel/App.tsx */
      .side-panel {
        width: 386px;
        flex: none;
        background: #fff;
        border-left: 1px solid #d7d7d7;
        box-shadow: -12px 0 35px rgba(0, 0, 0, 0.09);
      }
      .panel {
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        font-size: 14px;
        line-height: 1.43;
      }
      .panel header {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .panel h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.55;
        font-weight: 450;
      }
      .back {
        margin-left: -6px;
        padding: 4px;
        color: #737373;
        display: grid;
      }
      .muted {
        color: #737373;
      }
      .lead {
        margin: 0;
      }
      .icon {
        width: 18px;
        height: 18px;
        flex: none;
      }
      .green {
        color: #16a34a;
      }
      .blue {
        color: #2563eb;
      }
      .red {
        color: #b91c1c;
      }
      .spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .sites {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .site-button {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        font-weight: 425;
      }
      .site-button span {
        flex: 1;
      }
      .account {
        display: flex;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #f5f5f5;
      }
      .account .icon {
        margin-top: 1px;
      }
      .rows {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 0;
        border-top: 1px solid #e5e5e5;
      }
      .row.pending {
        color: #737373;
      }
      .count {
        margin-left: auto;
        color: #737373;
        font-variant-numeric: tabular-nums;
      }
      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        color: #737373;
        font-size: 12px;
      }
      .stat {
        border-radius: 8px;
        background: #f5f5f5;
        padding: 8px 10px;
      }
      .stat b {
        display: block;
        color: #171717;
        font-size: 20px;
        font-weight: 450;
        line-height: 1.4;
      }
      .footer {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .button {
        width: 100%;
        border-radius: 8px;
        padding: 8px 12px;
        border: 1px solid #e5e5e5;
        background: white;
        color: #171717;
      }
      .button.primary {
        background: #171717;
        border-color: #171717;
        color: white;
      }

      /* The caption on the page */
      .story-label {
        position: absolute;
        z-index: 2;
        left: 54px;
        bottom: 34px;
        max-width: 480px;
        padding: 16px 19px;
        border-radius: 13px;
        color: #f4f0f1;
        background: rgba(118, 71, 111, 0.97);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
      }
      .story-label b {
        display: block;
        margin-bottom: 3px;
        font-size: 18px;
        font-weight: 500;
      }
      .story-label span {
        color: #e2dcde;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="shot">
      <div class="browser">
        <div class="content">
          <section class="site" id="site"></section>
          <aside class="side-panel">
            <main class="panel" id="panel"></main>
          </aside>
        </div>
      </div>
    </div>

    <template id="letterboxd-page">
      <div class="lb-header">
        <div class="lb-brand">Letterboxd</div>
        <div class="lb-nav"><span>Films</span><span>Lists</span><span>Members</span></div>
      </div>
      <div class="lb-page">
        <h2>Diary</h2>
        <div class="lb-tabs">
          <span>Profile</span><span>Films</span><span class="active">Diary</span
          ><span>Watchlist</span>
        </div>
        <div class="diary-row">
          <div class="diary-day">24</div>
          <div class="poster" style="background: linear-gradient(145deg, #3c2a1a, #d8a25a)"></div>
          <div><b>Dune: Part Two</b></div>
          <div>2024</div>
          <div class="stars">★★★★½</div>
        </div>
        <div class="diary-row">
          <div class="diary-day">21</div>
          <div class="poster" style="background: linear-gradient(145deg, #1f3a4a, #9cc3d0)"></div>
          <div><b>Past Lives</b></div>
          <div>2023</div>
          <div class="stars">★★★★★</div>
        </div>
        <div class="diary-row">
          <div class="diary-day">14</div>
          <div class="poster" style="background: linear-gradient(145deg, #2a1c18, #c4683c)"></div>
          <div><b>Oppenheimer</b></div>
          <div>2023</div>
          <div class="stars">★★★★</div>
        </div>
        <div class="diary-row">
          <div class="diary-day">09</div>
          <div class="poster" style="background: linear-gradient(145deg, #17323c, #6fb0b8)"></div>
          <div><b>Aftersun</b></div>
          <div>2022</div>
          <div class="stars">★★★★½</div>
        </div>
        <div class="diary-row">
          <div class="diary-day">02</div>
          <div class="poster" style="background: linear-gradient(145deg, #23301f, #9fb57a)"></div>
          <div><b>Perfect Days</b></div>
          <div>2023</div>
          <div class="stars">★★★★</div>
        </div>
      </div>
      <div class="story-label" id="story"></div>
    </template>

    <template id="kinopoisk-page">
      <div class="kp-header">
        <div class="kp-brand">Кинопоиск</div>
        <div class="kp-nav"><span>Фильмы</span><span>Сериалы</span><span>Моё кино</span></div>
      </div>
      <div class="library">
        <div class="eyebrow">Личная коллекция</div>
        <h2>Мои фильмы</h2>
        <p class="library-lead">Оценки, просмотры и сохранённые фильмы.</p>
        <div class="filter-row">
          <span class="chip active">Оценки</span><span class="chip">Просмотры</span
          ><span class="chip">Буду смотреть</span><span class="chip">Любимые фильмы</span>
        </div>
        <div class="movie">
          <div class="poster" style="background: linear-gradient(145deg, #303030, #ff6b00)"></div>
          <div><b>Интерстеллар</b><small>Interstellar · 2014</small></div>
          <div class="kp-rating">9</div>
        </div>
        <div class="movie">
          <div class="poster" style="background: linear-gradient(145deg, #b68f63, #202020)"></div>
          <div><b>Дюна: Часть вторая</b><small>Dune: Part Two · 2024</small></div>
          <div class="kp-rating">8</div>
        </div>
        <div class="movie">
          <div class="poster" style="background: linear-gradient(145deg, #25394a, #7899a8)"></div>
          <div><b>Извне</b><small>From · 2022</small></div>
          <div class="kp-rating">8</div>
        </div>
        <div class="movie">
          <div class="poster" style="background: linear-gradient(145deg, #531a16, #e6a447)"></div>
          <div><b>Орудия</b><small>Weapons · 2025</small></div>
          <div class="kp-rating">7</div>
        </div>
        <div class="movie">
          <div class="poster" style="background: linear-gradient(145deg, #1f211f, #78836c)"></div>
          <div><b>Разделение</b><small>Severance · 2022</small></div>
          <div class="kp-rating">9</div>
        </div>
      </div>
      <div class="story-label" id="story"></div>
    </template>

    <script>
      // Hugeicons, as the side panel draws them.
      const ICONS = {
        arrowLeft:
          '<path d="M5.5 12.002H19" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><path d="M10.9999 18.002C10.9999 18.002 4.99998 13.583 4.99997 12.0019C4.99996 10.4208 11 6.00195 11 6.00195" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>',
        chevronRight:
          '<path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>',
        check:
          '<path d="M5 14L8.5 17.5L19 6.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>',
        circle:
          '<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5"/>',
        loader:
          '<path d="M21.9961 12C21.9961 17.5228 17.5189 22 11.9961 22C6.47325 22 1.99609 17.5228 1.99609 12C1.99609 6.47715 6.47325 2 11.9961 2" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"/>',
        calendar:
          '<path d="M16 2V6M8 2V6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><path d="M13 4H11C7.22876 4 5.34315 4 4.17157 5.17157C3 6.34315 3 8.22876 3 12V14C3 17.7712 3 19.6569 4.17157 20.8284C5.34315 22 7.22876 22 11 22H13C16.7712 22 18.6569 22 19.8284 20.8284C21 19.6569 21 17.7712 21 14V12C21 8.22876 21 6.34315 19.8284 5.17157C18.6569 4 16.7712 4 13 4Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><path d="M3 10H21" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><path d="M12.1258 14H12.0008M12.1258 18H12.0008M7.625 14H7.5M7.625 18H7.5M16.625 14H16.5M12.2508 14C12.2508 14.1381 12.1389 14.25 12.0008 14.25C11.8628 14.25 11.7508 14.1381 11.7508 14C11.7508 13.8619 11.8628 13.75 12.0008 13.75C12.1389 13.75 12.2508 13.8619 12.2508 14ZM12.2508 18C12.2508 18.1381 12.1389 18.25 12.0008 18.25C11.8628 18.25 11.7508 18.1381 11.7508 18C11.7508 17.8619 11.8628 17.75 12.0008 17.75C12.1389 17.75 12.2508 17.8619 12.2508 18ZM7.75 14C7.75 14.1381 7.63807 14.25 7.5 14.25C7.36193 14.25 7.25 14.1381 7.25 14C7.25 13.8619 7.36193 13.75 7.5 13.75C7.63807 13.75 7.75 13.8619 7.75 14ZM7.75 18C7.75 18.1381 7.63807 18.25 7.5 18.25C7.36193 18.25 7.25 18.1381 7.25 18C7.25 17.8619 7.36193 17.75 7.5 17.75C7.63807 17.75 7.75 17.8619 7.75 18ZM16.75 14C16.75 14.1381 16.6381 14.25 16.5 14.25C16.3619 14.25 16.25 14.1381 16.25 14C16.25 13.8619 16.3619 13.75 16.5 13.75C16.6381 13.75 16.75 13.8619 16.75 14Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>',
        eye: '<path d="M21.544 11.045C21.848 11.4713 22 11.6845 22 12C22 12.3155 21.848 12.5287 21.544 12.955C20.1779 14.8706 16.6892 19 12 19C7.31078 19 3.8221 14.8706 2.45604 12.955C2.15201 12.5287 2 12.3155 2 12C2 11.6845 2.15201 11.4713 2.45604 11.045C3.8221 9.12944 7.31078 5 12 5C16.6892 5 20.1779 9.12944 21.544 11.045Z" stroke="currentColor" stroke-width="1.5"/><path d="M15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15C13.6569 15 15 13.6569 15 12Z" stroke="currentColor" stroke-width="1.5"/>',
        clock:
          '<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/><path d="M12 8V12L14 14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>',
        star: '<path d="M13.7276 3.44418L15.4874 6.99288C15.7274 7.48687 16.3673 7.9607 16.9073 8.05143L20.0969 8.58575C22.1367 8.92853 22.6167 10.4206 21.1468 11.8925L18.6671 14.3927C18.2471 14.8161 18.0172 15.6327 18.1471 16.2175L18.8571 19.3125C19.417 21.7623 18.1271 22.71 15.9774 21.4296L12.9877 19.6452C12.4478 19.3226 11.5579 19.3226 11.0079 19.6452L8.01827 21.4296C5.8785 22.71 4.57865 21.7522 5.13859 19.3125L5.84851 16.2175C5.97849 15.6327 5.74852 14.8161 5.32856 14.3927L2.84884 11.8925C1.389 10.4206 1.85895 8.92853 3.89872 8.58575L7.08837 8.05143C7.61831 7.9607 8.25824 7.48687 8.49821 6.99288L10.258 3.44418C11.2179 1.51861 12.7777 1.51861 13.7276 3.44418Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>',
        heart:
          '<path d="M10.4107 19.9677C7.58942 17.858 2 13.0348 2 8.69444C2 5.82563 4.10526 3.5 7 3.5C8.5 3.5 10 4 12 6C14 4 15.5 3.5 17 3.5C19.8947 3.5 22 5.82563 22 8.69444C22 13.0348 16.4106 17.858 13.5893 19.9677C12.6399 20.6776 11.3601 20.6776 10.4107 19.9677Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>',
      }
      const icon = (name, className = '') =>
        `<svg class="icon ${className}" viewBox="0 0 24 24" fill="none" aria-hidden="true">${ICONS[name]}</svg>`

      const header = (title, back = true) =>
        `<header>${back ? `<span class="back">${icon('arrowLeft')}</span>` : ''}<h1>${title}</h1></header>`
      const row = (iconHtml, label, count = '', pending = false) =>
        `<li class="row${pending ? ' pending' : ''}">${iconHtml}${label}<span class="count">${count}</span></li>`
      const done = (label, count) => row(icon('check', 'green'), label, count)
      const pending = (label) => row(icon('circle'), label, '', true)

      const SITES = {
        letterboxd: {
          page: 'letterboxd-page',
        },
        kinopoisk: {
          page: 'kinopoisk-page',
        },
      }

      const SHOTS = {
        pick: {
          site: 'letterboxd',
          story:
            '<b>Letterboxd or Kinopoisk</b><span>Pick the site your library is on. You get one file to import into Foyerr.</span>',
          panel: `${header('Foyerr Import Helper', false)}
            <p class="lead muted">Pick the site your library is on. You'll get a file to import into Foyerr.</p>
            <div class="sites">
              <div class="site-button"><span>Letterboxd</span>${icon('chevronRight', 'muted')}</div>
              <div class="site-button"><span>Kinopoisk</span>${icon('chevronRight', 'muted')}</div>
            </div>`,
        },
        'letterboxd-progress': {
          site: 'letterboxd',
          story:
            '<b>Every diary entry, with its date</b><span>The panel reads your diary, films and watchlist one page at a time and shows where it is.</span>',
          panel: `${header('Exporting…', false)}
            <p class="lead muted">Keep this panel open.</p>
            <ul class="rows">
              ${done('Diary', '412')}
              ${row(icon('loader', 'blue spin'), 'Films', 'page 14 of 23')}
              ${pending('Watchlist')}
              ${pending('TMDB IDs')}
            </ul>
            <div class="footer"><button class="button">Cancel</button></div>`,
        },
        'letterboxd-done': {
          site: 'letterboxd',
          story:
            '<b>One file for Foyerr</b><span>Ratings, watches and your watchlist with TMDB IDs, saved to your downloads.</span>',
          panel: `${header('Export saved')}
            <p class="lead muted">letterboxd-library.json is in your downloads.</p>
            <div class="stats">
              <div class="stat"><b>401</b>Ratings</div>
              <div class="stat"><b>11</b>Watches</div>
              <div class="stat"><b>6</b>Seen</div>
              <div class="stat"><b>127</b>Watchlist</div>
            </div>
            <div class="footer">
              <button class="button primary">Download again</button>
              <button class="button">Start over</button>
            </div>`,
        },
        'kinopoisk-ready': {
          site: 'kinopoisk',
          story:
            '<b>Kinopoisk too</b><span>Ratings, watches, watchlist and favorites, with the dates from your pages.</span>',
          panel: `${header('Kinopoisk Export')}
            <div class="account">${icon('check', 'green')}<span>Signed in on kinopoisk.ru</span></div>
            <ul class="rows">
              ${row(icon('eye'), 'Watches')}
              ${row(icon('star'), 'Ratings')}
              ${row(icon('clock'), 'Watchlist')}
              ${row(icon('heart'), 'Favorites')}
            </ul>
            <div class="footer"><button class="button primary">Export library</button></div>`,
        },
      }

      const shot = SHOTS[new URLSearchParams(location.search).get('shot')] ?? SHOTS.pick
      const site = SITES[shot.site]
      const siteElement = document.querySelector('#site')
      siteElement.className = `site ${shot.site}`
      siteElement.append(document.querySelector(`#${site.page}`).content.cloneNode(true))
      document.querySelector('#story').innerHTML = shot.story
      document.querySelector('#panel').innerHTML = shot.panel
    </script>
  </body>
</html>
